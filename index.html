<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Workout</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f7f8;--card:#fff;--text:#111;--muted:#6b7280;--border:#e5e7eb;--accent:#111;--soft:#f1f3f5}
    @media(prefers-color-scheme:dark){:root{--bg:#0d0d0f;--card:#171719;--text:#f5f5f5;--muted:#9ca3af;--border:#2a2a2d;--accent:#fff;--soft:#222225}}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--border);padding:4px;border-radius:14px;margin-bottom:18px}.tab{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:10px;font-weight:700}.tab.active{background:var(--accent);color:var(--bg)}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px}.date{font-size:13px;color:var(--muted)}h1{font-size:26px;margin:3px 0 0}h2{font-size:19px;margin:0 0 10px}
    select,input,button{font:inherit}select,input{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px}button{touch-action:manipulation}label{font-size:13px;color:var(--muted)}.swap{min-width:150px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}.exercise-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.name{font-weight:700}.range{font-size:13px;color:var(--muted);white-space:nowrap}.previous{font-size:12px;color:var(--muted);margin-top:4px}.progress-note{font-size:13px;font-weight:700;margin:0 0 11px;padding:9px 10px;border-radius:10px;background:var(--soft)}
    .set-grid{display:grid;grid-template-columns:38px 1fr 1fr;gap:8px;align-items:center}.set-grid.head{font-size:12px;color:var(--muted);margin-bottom:6px}.set-grid+.set-grid{margin-top:7px}.setno{text-align:center;font-weight:600}.lastset{display:grid;grid-template-columns:38px 1fr 1fr;gap:8px;font-size:11px;color:var(--muted);margin:3px 0 7px}.lastset span:not(:first-child){padding-left:2px}
    .band-line{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.smallbtn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;font-weight:650}.band-manager{display:none;margin:0 0 10px;padding:10px;border:1px solid var(--border);border-radius:12px}.band-manager.show{display:block}.band-item{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:5px 0}.band-item button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:5px 9px}.band-help{font-size:11px;color:var(--muted);margin-top:5px}
    .farmer-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.carry-row{padding:10px 0;border-top:1px solid var(--border)}.carry-row:first-of-type{border-top:0}.carry-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800}.timer-actions{display:flex;gap:7px;margin-top:8px}.timer-actions button{flex:1;border:1px solid var(--border);border-radius:11px;padding:9px;background:var(--card);color:var(--text);font-weight:650}.timer-actions .primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.timer-status{font-size:12px;color:var(--muted);margin-top:6px}.result-box{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:9px 10px;margin-top:8px}.result-box button{border:0;background:transparent;color:var(--text);text-decoration:underline;padding:2px}
    .ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:22px;margin-top:4px}.note{color:var(--muted);font-size:14px;line-height:1.45}.callout{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin:12px 0}.done{width:100%;border:0;border-radius:14px;padding:13px;background:var(--accent);color:var(--bg);font-weight:700;margin-top:8px}
    .dash-controls{margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.summary .card{margin:0}.big{font-size:24px;font-weight:800;margin-top:3px}.chart{width:100%;height:220px;display:block}.axis{stroke:var(--border);stroke-width:1}.line{fill:none;stroke:var(--text);stroke-width:2.5}.dot{fill:var(--text)}.chart-label{font-size:10px;fill:var(--muted)}.history-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}.history-row:first-child{border-top:0}.muted{color:var(--muted)}.hidden{display:none!important}
  </style>
</head>
<body>
<div class="app">
  <div class="tabs"><button id="tabWorkout" class="tab active">Workout</button><button id="tabProgress" class="tab">Progress</button></div>
  <section id="workoutView">
    <div class="top"><div><div id="todayLabel" class="date"></div><h1 id="workoutTitle"></h1></div><label class="swap">Swap workout<select id="workoutSelect"><option value="strength">Strength</option><option value="incline">Incline walk</option><option value="airbike">Air bike</option><option value="rest">Rest</option></select></label></div>
    <main id="content"></main>
  </section>
  <section id="progressView" class="hidden">
    <h1 style="margin-bottom:14px">Progress</h1>
    <label class="dash-controls">Exercise<select id="exerciseSelect"></select></label>
    <div id="progressContent"></div>
  </section>
</div>
<script>
const exercises=[
{id:'pullups',name:'Assisted pull-ups',sets:3,min:6,max:10,type:'band'},
{id:'rdl',name:'Romanian deadlift',sets:2,min:6,max:10,type:'weight'},
{id:'legpress',name:'Leg press',sets:3,min:6,max:10,type:'weight'},
{id:'bench',name:'Bench press',sets:3,min:6,max:10,type:'weight'},
{id:'row',name:'Seated cable row',sets:2,min:8,max:12,type:'weight'},
{id:'farmer',name:'Farmer carry',sets:2,min:30,max:45,type:'farmer'},
{id:'abwheel',name:'Ab wheel',sets:1,min:6,max:12,type:'abwheel'}
];
const oldIndex={pullups:0,rdl:1,legpress:2,bench:3,row:4,abwheel:5};
const plans={strength:{title:'Strength',exercises},incline:{title:'Incline walk'},airbike:{title:'Air bike intervals'},rest:{title:'Rest day'}};
const weekdayPlan={0:'rest',1:'strength',2:'incline',3:'strength',4:'airbike',5:'strength',6:'rest'};
const today=new Date();let active=weekdayPlan[today.getDay()];const $=id=>document.getElementById(id);const content=$('content');const select=$('workoutSelect');
$('todayLabel').textContent=today.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});select.value=active;
function getHistory(){try{return JSON.parse(localStorage.getItem('workoutHistory')||'{}')}catch{return {}}}
function saveHistory(h){localStorage.setItem('workoutHistory',JSON.stringify(h))}
function getBands(){try{return JSON.parse(localStorage.getItem('pullupBands')||'[]')}catch{return []}}
function saveBands(x){localStorage.setItem('pullupBands',JSON.stringify(x))}
function getCarryTarget(){return Math.min(45,Math.max(30,Number(localStorage.getItem('farmerTarget')||30)))}
function setCarryTarget(x){localStorage.setItem('farmerTarget',String(Math.min(45,Math.max(30,Number(x)||30))))}
function strengthSessions(){const h=getHistory();return Object.entries(h).map(([k,v])=>({key:k,...v})).filter(x=>x.type==='strength').sort((a,b)=>new Date(b.timestamp||b.date||b.key)-new Date(a.timestamp||a.date||a.key))}
function getData(session,ex){if(!session)return null;if(session.exerciseData?.[ex.id])return session.exerciseData[ex.id];const oi=oldIndex[ex.id];if(oi===undefined)return null;const sets=[];for(let i=1;i<=ex.sets;i++){const x=session.sets?.[`${oi}-${i}`];if(x)sets.push({load:x.load,reps:Number(x.reps)})}if(!sets.length)return null;if(ex.id==='pullups')return{legacyAssist:true,sets};if(ex.id==='abwheel')return{legacyBodyweight:true,reps:sets[0]?.reps||0};return{sets}}
function lastData(ex){for(const s of strengthSessions()){const d=getData(s,ex);if(d)return d}return null}
function sameNum(a,b){return Number(a)===Number(b)}
function qualifies(d,ex){if(!d)return false;
 if(ex.type==='weight'){return d.sets?.length===ex.sets&&d.sets.every(x=>Number(x.reps)>=ex.max)&&d.sets.every(x=>sameNum(x.load,d.sets[0].load))}
 if(ex.type==='band'){return !d.legacyAssist&&d.band&&d.reps?.length===ex.sets&&d.reps.every(x=>Number(x)>=ex.max)}
 if(ex.type==='farmer'){return Number(d.weight)>0&&d.carries?.length===2&&d.carries.every(x=>Number(x)>=45)}
 if(ex.type==='abwheel'){return Number(d.distance)>0&&Number(d.reps)>=12}
 return false}
function sameLevel(a,b,ex){if(!a||!b)return false;if(ex.type==='weight')return sameNum(a.sets?.[0]?.load,b.sets?.[0]?.load);if(ex.type==='band')return a.band===b.band;if(ex.type==='farmer')return sameNum(a.weight,b.weight);if(ex.type==='abwheel')return sameNum(a.distance,b.distance);return false}
function progression(ex){const rows=[];for(const s of strengthSessions()){const d=getData(s,ex);if(d)rows.push(d);if(rows.length===2)break}if(rows.length<2||!qualifies(rows[0],ex)||!qualifies(rows[1],ex)||!sameLevel(rows[0],rows[1],ex))return null;
 if(ex.type==='weight')return `Increase weight today — last 2 sessions hit ${ex.sets}×${ex.max} @ ${rows[0].sets[0].load} kg`;
 if(ex.type==='band')return `Use a lighter band today — last 2 sessions hit ${ex.max}/${ex.max}/${ex.max} with ${rows[0].band}`;
 if(ex.type==='farmer')return `Increase weight today — last 2 sessions reached 2×45 sec @ ${rows[0].weight} kg/hand`;
 if(ex.type==='abwheel')return `Increase distance today — last 2 sessions hit 12 reps @ ${rows[0].distance} cm`;
}
function previousText(ex,d){if(!d)return'';if(ex.type==='weight')return d.sets?.map(x=>`${x.load} kg × ${x.reps}`).join(' · ')||'';if(ex.type==='band')return d.legacyAssist?d.sets.map(x=>`${x.load} kg assist × ${x.reps}`).join(' · '):`${d.band} band × ${(d.reps||[]).join('/')}`;if(ex.type==='farmer')return `${d.weight} kg/hand × ${(d.carries||[]).map(x=>`${x}s`).join('/')}`;if(ex.type==='abwheel')return d.legacyBodyweight?`${d.reps} reps (old log)`:`${d.distance} cm × ${d.reps}`;return''}
function beep(freq=800,duration=120){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=beep.ctx||(beep.ctx=new C());if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.value=.12;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration/1000)}catch{}}
function vibrate(p){if(navigator.vibrate)navigator.vibrate(p)}
function addBand(name){name=(name||'').trim();if(!name)return;const bands=getBands();if(!bands.includes(name)){bands.push(name);saveBands(bands)}}
function bandOptions(selected=''){const bands=getBands();return `<option value="">Select band</option>${bands.map(b=>`<option ${b===selected?'selected':''}>${escapeHtml(b)}</option>`).join('')}`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderBandManager(container,selectEl){const box=container.querySelector('.band-manager');const draw=()=>{const bands=getBands();box.innerHTML=`<div class="band-help">Most assistance → least assistance</div>${bands.length?bands.map((b,i)=>`<div class="band-item"><span>${escapeHtml(b)}</span><button data-up="${i}" ${i===0?'disabled':''}>↑</button><button data-down="${i}" ${i===bands.length-1?'disabled':''}>↓</button></div>`).join(''):'<div class="band-help">No bands saved yet.</div>'}`;box.querySelectorAll('[data-up]').forEach(btn=>btn.onclick=()=>{const a=getBands(),i=Number(btn.dataset.up);[a[i-1],a[i]]=[a[i],a[i-1]];saveBands(a);draw();selectEl.innerHTML=bandOptions(selectEl.value)});box.querySelectorAll('[data-down]').forEach(btn=>btn.onclick=()=>{const a=getBands(),i=Number(btn.dataset.down);[a[i+1],a[i]]=[a[i],a[i+1]];saveBands(a);draw();selectEl.innerHTML=bandOptions(selectEl.value)})};draw();return draw}
function renderStrength(){const draft={type:'strength',version:3,date:new Date().toISOString().slice(0,10),timestamp:new Date().toISOString(),exerciseData:{}};
 exercises.forEach((ex,ei)=>{const prev=lastData(ex),card=document.createElement('section');card.className='card';const p=progression(ex);card.innerHTML=`<div class="exercise-head"><div><div class="name">${ei+1}. ${ex.name}</div>${prev?`<div class="previous">Last: ${previousText(ex,prev)}</div>`:''}</div><div class="range">${ex.type==='farmer'?'2 × 30–45 sec':`${ex.sets} × ${ex.min}–${ex.max}`}</div></div>${p?`<div class="progress-note">${p}</div>`:''}`;
 if(ex.type==='weight'){
   card.insertAdjacentHTML('beforeend','<div class="set-grid head"><span>Set</span><span>Weight kg</span><span>Reps</span></div>');
   for(let s=1;s<=ex.sets;s++){const old=prev?.sets?.[s-1];card.insertAdjacentHTML('beforeend',`<div class="set-grid"><div class="setno">${s}</div><input inputmode="decimal" type="number" step="0.5" data-w="${ex.id}-${s}" placeholder="kg"><input inputmode="numeric" type="number" data-r="${ex.id}-${s}" placeholder="reps"></div>${old?`<div class="lastset"><span></span><span>Last: ${old.load} kg</span><span>Last: ${old.reps} reps</span></div>`:''}`)}
 } else if(ex.type==='band'){
   card.insertAdjacentHTML('beforeend',`<div class="band-line"><select data-band="${ex.id}">${bandOptions(prev?.band||'')}</select><button class="smallbtn" data-add-band>+ Band</button></div><div class="band-manager"></div><div class="set-grid head"><span>Set</span><span></span><span>Reps</span></div>`);
   for(let s=1;s<=ex.sets;s++){const pr=prev&&!prev.legacyAssist?prev.reps?.[s-1]:null;card.insertAdjacentHTML('beforeend',`<div class="set-grid"><div class="setno">${s}</div><div></div><input inputmode="numeric" type="number" data-band-rep="${s}" placeholder="${pr||'reps'}"></div>`)}
   const bs=card.querySelector('[data-band]'),mgr=card.querySelector('.band-manager');renderBandManager(card,bs);card.querySelector('[data-add-band]').onclick=()=>{const name=prompt('Band name');if(name){addBand(name);bs.innerHTML=bandOptions(name);bs.value=name;mgr.classList.add('show');renderBandManager(card,bs)}};bs.ondblclick=()=>mgr.classList.toggle('show');
   const manage=document.createElement('button');manage.className='smallbtn';manage.style.width='100%';manage.style.marginTop='8px';manage.textContent='Order bands';manage.onclick=()=>mgr.classList.toggle('show');card.appendChild(manage);
 } else if(ex.type==='farmer'){
   const target=getCarryTarget();card.insertAdjacentHTML('beforeend',`<div class="farmer-controls"><label>kg per hand<input data-farmer-weight type="number" step="0.5" inputmode="decimal" placeholder="${prev?.weight||'kg'}"></label><label>Target seconds<input data-farmer-target type="number" min="30" max="45" step="1" value="${target}"></label></div><div data-carries></div>`);
   const targetEl=card.querySelector('[data-farmer-target]');targetEl.onchange=()=>{setCarryTarget(targetEl.value);renderCarryRows(card,Number(targetEl.value),prev)};renderCarryRows(card,target,prev);
 } else if(ex.type==='abwheel'){
   card.insertAdjacentHTML('beforeend',`<div class="ab-grid"><label>Knee-to-wall cm<input data-ab-distance type="number" step="1" inputmode="numeric" placeholder="${prev&&!prev.legacyBodyweight?prev.distance:'cm'}"></label><label>Reps<input data-ab-reps type="number" step="1" inputmode="numeric" placeholder="${prev?.reps||'reps'}"></label></div>`);
 }
 content.appendChild(card)});
 const btn=document.createElement('button');btn.className='done';btn.textContent='Save workout';btn.onclick=()=>{
   for(const ex of exercises){if(ex.type==='weight'){const sets=[];for(let s=1;s<=ex.sets;s++)sets.push({load:document.querySelector(`[data-w="${ex.id}-${s}"]`).value,reps:Number(document.querySelector(`[data-r="${ex.id}-${s}"]`).value)||0});draft.exerciseData[ex.id]={sets}}
   else if(ex.type==='band'){draft.exerciseData[ex.id]={band:document.querySelector('[data-band="pullups"]').value,reps:[...document.querySelectorAll('[data-band-rep]')].map(x=>Number(x.value)||0)}}
   else if(ex.type==='farmer'){draft.exerciseData[ex.id]={weight:Number(document.querySelector('[data-farmer-weight]').value)||0,target:Number(document.querySelector('[data-farmer-target]').value)||getCarryTarget(),carries:[...document.querySelectorAll('[data-carry-result]')].map(x=>Number(x.dataset.carryResult)||0)}}
   else if(ex.type==='abwheel'){draft.exerciseData[ex.id]={distance:Number(document.querySelector('[data-ab-distance]').value)||0,reps:Number(document.querySelector('[data-ab-reps]').value)||0}}
   }
   const h=getHistory();h['session-'+Date.now()]=draft;saveHistory(h);btn.textContent='Saved ✓';renderProgress()};content.appendChild(btn)
}
function renderCarryRows(card,target,prev){const wrap=card.querySelector('[data-carries]');wrap.innerHTML='';for(let i=0;i<2;i++){const row=document.createElement('div');row.className='carry-row';row.innerHTML=`<div class="carry-top"><strong>Carry ${i+1}</strong><div class="timer" data-timer>${target}s</div></div><div class="timer-actions"><button class="primary" data-start>Start</button></div><div class="timer-status" data-status>${prev?.carries?.[i]?`Last: ${prev.carries[i]}s`:''}</div><div class="result-box hidden" data-resultbox><span data-resulttext></span><button data-edit>Edit</button></div><span class="hidden" data-carry-result="0"></span>`;wrap.appendChild(row);setupCarryTimer(row,()=>Number(card.querySelector('[data-farmer-target]').value)||target)}}
function setupCarryTimer(row,getTarget){const timer=row.querySelector('[data-timer]'),actions=row.querySelector('.timer-actions'),status=row.querySelector('[data-status]'),box=row.querySelector('[data-resultbox]'),text=row.querySelector('[data-resulttext]'),store=row.querySelector('[data-carry-result]');let interval=null,startAt=0,phase='idle';
 const setResult=v=>{store.dataset.carryResult=String(v);text.textContent=`Logged: ${v} sec`;box.classList.remove('hidden')};
 const askEarly=()=>{clearInterval(interval);phase='done';const v=prompt('How long did you actually carry? (seconds)');if(v!==null&&Number(v)>=0)setResult(Math.round(Number(v)));actions.innerHTML='<button class="primary" data-restart>Start again</button>';actions.querySelector('[data-restart]').onclick=start};
 const finish=()=>{clearInterval(interval);phase='confirm';beep(1050,300);vibrate([200,100,200]);timer.textContent='Target reached';status.textContent='Confirm when you get back to the phone.';actions.innerHTML='<button class="primary" data-complete>Completed</button><button data-early>Stopped early</button>';actions.querySelector('[data-complete]').onclick=()=>{const t=getTarget();setResult(t);status.textContent='';phase='done';actions.innerHTML='<button data-restart>Start again</button>';actions.querySelector('[data-restart]').onclick=start};actions.querySelector('[data-early]').onclick=askEarly};
 function start(){box.classList.add('hidden');store.dataset.carryResult='0';phase='countdown';let n=5;timer.textContent=n;status.textContent='Get ready';actions.innerHTML='<button data-cancel>Cancel</button><button data-early>Stopped early</button>';actions.querySelector('[data-cancel]').onclick=()=>{clearInterval(interval);phase='idle';timer.textContent=`${getTarget()}s`;status.textContent='';actions.innerHTML='<button class="primary" data-start>Start</button>';actions.querySelector('[data-start]').onclick=start};actions.querySelector('[data-early]').onclick=askEarly;
   beep(300,50);interval=setInterval(()=>{n--;timer.textContent=n>0?n:'GO';if(n<=3&&n>0)beep(650+n*90,120);if(n===0){beep(1000,180);clearInterval(interval);phase='running';startAt=performance.now();status.textContent='Carry';interval=setInterval(()=>{const elapsed=(performance.now()-startAt)/1000,remaining=Math.max(0,getTarget()-elapsed);timer.textContent=`${remaining.toFixed(1)}s`;if(remaining<=0)finish()},100)}},1000)}
 actions.querySelector('[data-start]').onclick=start;row.querySelector('[data-edit]').onclick=()=>{const v=prompt('Set carry time (seconds)',store.dataset.carryResult||'');if(v!==null&&Number(v)>=0)setResult(Math.round(Number(v)))}}
function renderIncline(){content.innerHTML=`<div class="metric-grid"><div class="metric"><small>Warm-up</small><strong>5 min</strong></div><div class="metric"><small>Main work</small><strong>25 min</strong></div></div><div class="card" style="margin-top:12px"><div class="metric-grid"><label>Incline %<input type="number" step="0.5" value="6"></label><label>Speed km/h<input type="number" step="0.1" value="5"></label></div><p class="note">Progress main work 25 → 30 → 35 min before increasing incline.</p></div>`}
function renderAirbike(){content.innerHTML=`<div class="metric-grid"><div class="metric"><small>Warm-up</small><strong>5 min</strong></div><div class="metric"><small>Rounds</small><strong>6</strong></div></div><div class="callout"><strong>1 min hard + 2 min easy</strong><div class="note" style="margin-top:5px">Repeat for 6 rounds, then 5 min easy cool-down.</div></div><p class="note">Progress 6 → 7 → 8 rounds. Once 8 is solid, increase hard intervals to 90 sec.</p>`}
function render(){content.innerHTML='';$('workoutTitle').textContent=plans[active].title;if(active==='strength')renderStrength();else if(active==='incline')renderIncline();else if(active==='airbike')renderAirbike();else content.innerHTML='<div class="callout">No scheduled workout today. Use Swap workout if you want to train.</div>'}
function historyFor(ex){return strengthSessions().map(s=>{const d=getData(s,ex);return d?{date:new Date(s.timestamp||s.date||s.key),d}:null}).filter(Boolean).reverse()}
function chartValue(ex,d){if(ex.type==='weight'){const valid=(d.sets||[]).filter(x=>Number(x.load)>0);return valid.length?Math.max(...valid.map(x=>Number(x.load))):null}if(ex.type==='farmer')return Number(d.weight)||null;if(ex.type==='abwheel')return d.legacyBodyweight?null:Number(d.distance)||null;if(ex.type==='band')return null;return null}
function renderChart(hist,ex){const pts=hist.map(h=>({date:h.date,v:chartValue(ex,h.d)})).filter(x=>x.v!==null);if(pts.length<2)return '<p class="note">Log at least 2 comparable sessions to see a progress chart.</p>';const W=560,H=210,pad=32,vals=pts.map(p=>p.v);let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}const c=vals.map((v,i)=>({x:pad+i*(W-pad*2)/(vals.length-1),y:H-pad-(v-min)*(H-pad*2)/(max-min),v,date:pts[i].date}));return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><polyline class="line" points="${c.map(p=>`${p.x},${p.y}`).join(' ')}"/>${c.map(p=>`<circle class="dot" cx="${p.x}" cy="${p.y}" r="4"/>`).join('')}<text class="chart-label" x="${pad}" y="${H-7}">${c[0].date.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><text class="chart-label" text-anchor="end" x="${W-pad}" y="${H-7}">${c.at(-1).date.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><text class="chart-label" x="4" y="${pad+4}">${max}${ex.type==='abwheel'?' cm':' kg'}</text><text class="chart-label" x="4" y="${H-pad}">${min}${ex.type==='abwheel'?' cm':' kg'}</text></svg>`}
function summaryValue(ex,d){if(ex.type==='weight')return d.sets?.map(x=>`${x.load}×${x.reps}`).join(' · ')||'—';if(ex.type==='band')return d.legacyAssist?d.sets.map(x=>`${x.load}kg×${x.reps}`).join(' · '):`${d.band}: ${(d.reps||[]).join('/')}`;if(ex.type==='farmer')return `${d.weight} kg/hand: ${(d.carries||[]).map(x=>`${x}s`).join('/')}`;if(ex.type==='abwheel')return d.legacyBodyweight?`${d.reps} reps`:`${d.distance} cm × ${d.reps}`;return'—'}
function renderProgress(){const ex=exercises[Number($('exerciseSelect').value||0)],hist=historyFor(ex),pc=$('progressContent');if(!hist.length){pc.innerHTML='<div class="card"><p class="note">No logged sessions yet.</p></div>';return}const latest=hist.at(-1);pc.innerHTML=`<div class="summary"><div class="card"><div class="muted">Latest</div><div class="big" style="font-size:18px">${summaryValue(ex,latest.d)}</div></div><div class="card"><div class="muted">Progression</div><div style="font-weight:700;margin-top:6px">${progression(ex)||'Keep building'}</div></div></div><div class="card"><h2>${ex.name}</h2>${ex.type==='band'?'<p class="note">Band progression is tracked by band order rather than kg.</p>':renderChart(hist,ex)}</div><div class="card"><h2>Session history</h2>${hist.slice().reverse().slice(0,12).map(h=>`<div class="history-row"><span>${h.date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'2-digit'})}</span><strong>${summaryValue(ex,h.d)}</strong></div>`).join('')}</div>`}
select.onchange=()=>{active=select.value;render()};$('exerciseSelect').innerHTML=exercises.map((e,i)=>`<option value="${i}">${e.name}</option>`).join('');$('exerciseSelect').onchange=renderProgress;
$('tabWorkout').onclick=()=>{$('workoutView').classList.remove('hidden');$('progressView').classList.add('hidden');$('tabWorkout').classList.add('active');$('tabProgress').classList.remove('active')};$('tabProgress').onclick=()=>{$('workoutView').classList.add('hidden');$('progressView').classList.remove('hidden');$('tabWorkout').classList.remove('active');$('tabProgress').classList.add('active');renderProgress()};
render();if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
